    <title>UAG Studio - Omnissa UAG config builder</title>
    <script>
      try {
        var p = JSON.parse(localStorage.getItem('gateway-forge.appearance.v1') || 'null') || {};
        var palette = ['original', 'harbor', 'slate'].includes(p.palette) ? p.palette : 'original';
        var theme = ['system', 'light', 'dark'].includes(p.theme) ? p.theme : 'system';
        document.documentElement.dataset.palette = palette;
        document.documentElement.dataset.theme = theme === 'system' ? (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light') : theme;
      } catch (e) {
        document.documentElement.dataset.palette = 'original';
        document.documentElement.dataset.theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      }
    </script>
