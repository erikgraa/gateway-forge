name: Nightly container

on:
  schedule:
    - cron: '30 2 * * *'
  push:
    branches: [main]
    paths:
      - 'Dockerfile'
      - 'docker/**'
      - '.github/workflows/container.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: container
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  verify:
    name: Verify (lifecycle + check + tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - name: Compare supported UAG versions with the Omnissa Lifecycle Matrix
        run: |
          set -uo pipefail
          if ! page=$(curl -fsSL --retry 3 --retry-delay 5 --max-time 60 -A "Mozilla/5.0" "https://docs.omnissa.com/bundle/Product-Lifecycle-Matrix/page/lifecyclematrix.html"); then
            echo "::warning::Could not fetch the Omnissa Lifecycle Matrix; skipping the lifecycle comparison."
            exit 0
          fi
          upstream=$(echo "$page" | tr '\n' ' ' | sed -e 's/<[^>]*>/ /g' -e 's/&nbsp;/ /g' | tr -s ' ' | { grep -oE 'Unified Access Gateway [0-9]{4} Supported' || true; } | grep -oE '[0-9]{4}' | sort -u | tr '\n' ' ' | sed 's/ $//')
          local=$(grep -oE "id: '[0-9]{4}'" src/lib/versions.ts | grep -oE '[0-9]{4}' | sort -u | tr '\n' ' ' | sed 's/ $//')
          echo "upstream: $upstream"; echo "local:    $local"
          if [ -n "$upstream" ] && [ "$upstream" != "$local" ]; then
            echo "::warning::Supported UAG versions changed upstream ($upstream) vs src/lib/versions.ts ($local). The container is still built; update versions.ts."
          fi

  publish:
    name: Build and push image
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Compute tags
        id: meta
        run: |
          d=$(date -u +%Y%m%d)
          echo "tags=${IMAGE}:nightly,${IMAGE}:nightly-${d},${IMAGE}:latest,${IMAGE}:sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          echo "version=nightly-${d}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            REVISION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test the pushed image
        run: |
          docker run -d --name gf -p 8080:8080 "${IMAGE}:sha-${GITHUB_SHA::7}"
          for i in $(seq 1 20); do curl -fsS http://127.0.0.1:8080/healthz && break || sleep 1; done
          curl -fsS http://127.0.0.1:8080/ | grep -q "Gateway Forge"
          curl -fsSI http://127.0.0.1:8080/ | grep -i "content-security-policy"
          docker rm -f gf
